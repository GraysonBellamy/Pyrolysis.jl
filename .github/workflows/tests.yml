# The numerical gate. Two matrices:
#
# fast, on pull requests to main and by dispatch: every suite at its CI
# resolution in the temperature form, without the convergence spot checks
# (PYROLYSIS_TEST_FAST), in four jobs side by side: the module suites in their
# three groups (test/runtests.jl) and the verification cases. The package is
# built without its precompile workloads, whose test runs them in the
# test process.
#
# full, weekly and by dispatch with `matrix: full`: `Pkg.test()` as a user runs
# it (every suite, the verification cases with their spot checks, both energy
# forms in the module suites), and the verification cases in the enthalpy
# form with their spot checks. The package is built with its precompile
# workloads, as for a user.
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      matrix:
        description: "fast (the pull-request partition) or full"
        type: choice
        options: [fast, full]
        default: fast
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'fast' || inputs.matrix || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    if: github.event_name == 'pull_request' || inputs.matrix == 'fast'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Module suites (Jacobian, multi-D, type analysis)
            group: jacobian
          - name: Module suites (burnout)
            group: burnout
          - name: Module suites (other)
            group: other
          - name: Verification cases
            group: domains
    env:
      PYROLYSIS_TEST_FAST: "1"
      PYROLYSIS_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - name: Build without the precompile workloads
        run: printf '[Pyrolysis]\nprecompile_workloads = false\n' > LocalPreferences.toml
      - name: Record the environment
        run: |
          echo "commit $(git rev-parse HEAD) (tree $(git rev-parse 'HEAD^{tree}'))"
          echo "event ${{ github.event_name }}; pull request head ${{ github.event.pull_request.head.sha || 'none' }}"
          sha256sum Manifest.toml test/Manifest.toml
          cat LocalPreferences.toml
          julia -e 'using InteractiveUtils; versioninfo()'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test()'

  full:
    if: github.event_name == 'schedule' || inputs.matrix == 'full'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pkg.test()
            energy: temperature
            group: all
          - name: Verification cases, enthalpy form
            energy: enthalpy
            group: domains
    env:
      PYROLYSIS_ENERGY_STATE: ${{ matrix.energy }}
      PYROLYSIS_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - name: Record the environment
        run: |
          echo "commit $(git rev-parse HEAD) (tree $(git rev-parse 'HEAD^{tree}'))"
          echo "event ${{ github.event_name }} on ${{ github.ref }}"
          sha256sum Manifest.toml test/Manifest.toml
          julia -e 'using InteractiveUtils; versioninfo()'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run the tests
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test()'
