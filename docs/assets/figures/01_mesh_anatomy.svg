<title id="title">Figure 1. Finite-Volume Mesh (Schematic)</title><desc id="desc">Nonuniform cells run from the pinned back to the exposed surface. The highlighted interior face sends equal and opposite flux contributions to its owner and neighbour; dots mark cell centres and nodes.</desc>
