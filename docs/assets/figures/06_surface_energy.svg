<title id="title">Figure 6. Surface Energy Transfers (Schematic)</title><desc id="desc">Absorbed radiation balances inward conduction and outward radiative and convective losses. Gas-carried enthalpy is shown separately as a contribution to the outward face energy flux, not to the surface-temperature balance.</desc>
