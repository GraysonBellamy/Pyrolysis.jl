<title id="title">Figure 7. Where Radiation Is Absorbed (Schematic)</title><desc id="desc">Matching slabs receive radiation from the right. Surface absorption takes the absorbed flux into the surface balance at the face. Radiative transfer carries a downward and an upward hemispherical flux at every face, crosses the exposed face at the emissivity of the cell beside it both ways, sends a collimated heater in as a beam, and reflects everything at a mirror back. The chart gives the two fluxes of the worked slab of Technical Reference section 8.8, from the solver.</desc>
