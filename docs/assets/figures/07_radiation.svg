<title id="title">Figure 7. Radiation Absorption (Schematic)</title><desc id="desc">Matching slabs receive radiation from the right: surface absorption deposits it at the boundary, while Beer–Lambert attenuation distributes absorption through cells and transmits the remainder. The plotted intensity uses uniform optical depth alpha L equal to two.</desc>
