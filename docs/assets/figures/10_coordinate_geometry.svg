<circle cx="995" cy="260" r="55" fill="white" stroke="#295674" stroke-width="1.3"/>
<path d="M 995 260 L 1063 192 A 96 96 0 0 1 1091 260 Z" fill="#ededed" stroke="#365b58" stroke-width="1.5" stroke-dasharray=""/>
<line x1="995" y1="260" x2="1103" y2="260" stroke="#202020" stroke-width="1.5" stroke-dasharray="" marker-end="url(#ink)"/>
<text x="1043.000" y="229.000" font-size="23" fill="#365b58" text-anchor="start" font-weight="normal" >A</text>
<text x="1100.000" y="286.000" font-size="18" fill="#202020" text-anchor="start" font-weight="normal" >r₊</text>
<text x="1025.000" y="286.000" font-size="18" fill="#202020" text-anchor="start" font-weight="normal" >r₋</text>
<text x="1000.000" y="395.000" font-size="18" fill="#202020" text-anchor="middle" font-weight="normal" >A: Solid Angle of Radial Sector</text>
<text x="838.000" y="466.000" font-size="19" fill="#202020" text-anchor="start" font-weight="normal" ><tspan font-family="Liberation Mono, monospace" font-size="90%">cross_section</tspan> = A [sr]</text>
<text x="838.000" y="497.000" font-size="19" fill="#202020" text-anchor="start" font-weight="normal" >Face Area: A r²</text>
</g></svg>
