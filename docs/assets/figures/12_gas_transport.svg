<title id="title">Figure 12. Gas Storage and Transport (Schematic)</title><desc id="desc">A porous cell distinguishes gas mass per bulk volume from pore density. The relative flux follows a lumped or dusty-gas closure; skeleton motion carries pore gas. A boundary diagram matches the porous flux to a reservoir through an optional mass film and accounts for carried enthalpy once.</desc>
