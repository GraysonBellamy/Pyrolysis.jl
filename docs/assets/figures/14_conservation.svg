<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">Figure 14. Conservation of the Live Inventory (Schematic)</title><desc id="desc">Mass and sensible enthalpy are counted over live cells. Internal transfers cancel; boundary outflow and event losses leave the domain. The energy sources include reaction heat, radiation and sensible-enthalpy formation.</desc>
<defs>
