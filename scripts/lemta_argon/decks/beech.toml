# Beech (Fagus), grain across the heat flux. Sources:
#   Th     H. Flity, PhD thesis, Université de Lorraine (2023), printed pages;
#   IJTS25 Flity et al., Int. J. Therm. Sci. 210 (2025) 109545.
# The dry density is each test's own (its file name), not a deck value.
species = "beech"
dataset = "Beech"   # name in doi:10.57745/QRYAJ9
thesis = "hêtre"   # name in Th
genus = "Fagus"

# Optics of the virgin wood (IJTS25 Fig. 12, read from its vector paths to
# ±0.0005; Th Figs. 2.16–2.17 give the same to ±0.001): the Planck-mean
# emissivity at the surface temperature, and the absorptivity of a 4 kW/m²
# cone, which equals the emissivity at 230 °C.
emissivity_T_C = [30.0, 80.0, 130.0, 180.0, 230.0]
emissivity = [0.941, 0.938, 0.935, 0.930, 0.925]
absorptivity = 0.925

# Char conductivity law (chamber.toml [k_char]). Beech char was not measured.
char_conductivity = "pooled"

# Shrinkage of the converted layer in the cone tests of this chamber, 12 min
# under argon (Terrei et al., doi:10.57745/I9CL2R, inert rows: lost thickness
# over char + lost; 35 and 45 kW/m²: 0.43, 0.40, 0.37). Used by `shrinkage = :cone`.
shrinkage_cone = 0.40

# Three independent first-order reactions of the dry wood, fitted to TGA in N₂
# at 5, 10 and 20 K/min (Th Annex C, Table C.6, p.171): S1 → gas,
# S2 → γ2 C2 + gas, S3 → γ3 C3 + gas; α is each pseudo-component's share of the
# dry wood, γ the char per kg of its reactant. A in s⁻¹, E in J/mol.
[kinetics]
A = [8.6e8, 1.2e12, 53.0]
E = [121.2e3, 171.7e3, 69.8e3]
alpha = [0.21, 0.61, 0.18]
gamma = [0.0, 0.15, 0.57]

# Heats [J per g of initial dry wood, positive endothermic], with H3 = 0 and
# H4 that of the heat-only step C2 → C4 (Th §4.3; the same basis as Flity et
# al. 2023 FSJ Eq. 11). Mean of the two beech DSC tests at 20 mL/min (Yc 20.9 and
# 21.1 %), read from Th Figs. 4.15–4.17 (p.93; no table): H1 −73.1/−61.5,
# H2 +72.6/+72.4, H1 + H2 + H4 −134.1/−87.4.
[heats]
H1 = -67.3
H2 = 72.5
H4 = -116.0
