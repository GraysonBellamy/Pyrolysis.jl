# Silver fir (Abies), grain across the heat flux. Sources:
#   Th     H. Flity, PhD thesis, Université de Lorraine (2023), printed pages;
#   IJTS25 Flity et al., Int. J. Therm. Sci. 210 (2025) 109545.
# The dry density is each test's own (its file name), not a deck value.
species = "fir"
dataset = "Fir"   # name in doi:10.57745/QRYAJ9
thesis = "sapin"   # name in Th
genus = "Abies"

# Optics of the virgin wood (IJTS25 Fig. 12, read from its vector paths to
# ±0.0005; Th Figs. 2.16–2.17 give the same to ±0.001): the Planck-mean
# emissivity at the surface temperature, and the absorptivity of a 4 kW/m²
# cone, which equals the emissivity at 230 °C.
# Fir was not measured (absent from IJTS25 Fig. 12 and Th Figs. 2.15–2.17):
# these are spruce's, the closest species measured (both Pinaceae softwoods).
emissivity_T_C = [30.0, 80.0, 130.0, 180.0, 230.0]
emissivity = [0.926, 0.923, 0.917, 0.911, 0.904]
absorptivity = 0.904

# Char conductivity law (chamber.toml [k_char]). The preprint's "fir" char is very probably the
# thesis's spruce char (identical photograph and TGA curve), so the fir deck
# takes the pooled law.
char_conductivity = "pooled"

# Three independent first-order reactions of the dry wood, fitted to TGA in N₂
# at 5, 10 and 20 K/min (Th Annex C, Table C.3, p.168): S1 → gas,
# S2 → γ2 C2 + gas, S3 → γ3 C3 + gas; α is each pseudo-component's share of the
# dry wood, γ the char per kg of its reactant. A in s⁻¹, E in J/mol.
[kinetics]
A = [7.1e8, 1.3e12, 202.0]
E = [122.0e3, 174.0e3, 78.0e3]
alpha = [0.16, 0.63, 0.21]
gamma = [0.0, 0.09, 0.57]

# Heats [J per g of initial dry wood, positive endothermic], with H3 = 0 and
# H4 that of the heat-only step C2 → C4 (Th §4.3; the same basis as Flity et
# al. 2023 FSJ Eq. 11). Fir was not tested by DSC: the six-species fits of Th
# Figs. 4.15–4.17 (see balsa.toml) at this deck's char yield 17.64 %, the low
# edge of the fitted range (17–26 %).
[heats]
H1 = -28.2
H2 = 105.8
H4 = -68.7
