# Oak (Quercus), grain across the heat flux at the top level; [along] holds what
# changes with the grain along it.
#   Diarra et al. 2026, Table 1 (density); Flity et al. 2025, Fig. 12 and Table 1.
species = "oak"
genus = "Quercus"
rho_dry = 511.0
absorptivity = 0.925
emissivity_T_C = [30.0, 80.0, 130.0, 180.0, 230.0]
emissivity = [0.940, 0.938, 0.934, 0.930, 0.925]
h_front_heating = 7.1
h_front_cooling = 4.3
h_rear = 12.2
# Darcy permeability across the grain [m²]: Choong et al. 1974 Tables 2–3,
# Quercus alba (white oak), apparent, N₂ at 1.2 atm: sapwood R 9.9e-16, T 2.0e-16;
# corewood R 3.9e-16, T 2.0e-16 (along the grain 1.3e-12 and 4.4e-14).
permeability = 3.0e-16
# Sorption isotherm of the phase change: the CAST set of Dietenberger, Glass &
# Boardman (2024) fitted to beech, taken for this hardwood.
isotherm = "CAST_BEECH"

# Grain along the heat flux. The optics and the convection stay those of the
# top level: the same rig and holder, and the end-grain face's optics were not
# measured.
[along]
rho_dry = 683.0          # kg/m³, Diarra et al. 2026 Table 1 (//)
# Conductivity along the grain, dry [W/(m K)]: Flity et al., Int. J. Therm.
# Sci. 195 (2024) 108661, Table A.10 (oak, 627 kg/m³), at the
# temperatures k_T_C [°C], scaled by rho_dry/rho_k (linear in density, their
# Fig. 9).
# The 110 °C entry is the one printed for larch (0.47 ± 0.74 %).
k_T_C = [20.0, 60.0, 110.0, 160.0]
k = [0.48, 0.464, 0.47, 0.44]
rho_k = 627.0
# Darcy permeability along the grain [m²]: Choong et al. 1974, the geometric
# mean of sapwood 1.3e-12 and corewood 4.4e-14, as cited above.
permeability = 2.4e-13
# Transfer coefficient [m²/s]: ten times the 1.5e-6 across the grain. Bound
# water diffuses 50–100 times faster along the grain than across it at 5 %
# moisture and 2–4 times at 30 % (Siau 1984 p. 206): ten is the ratio near
# 20 %, about forty near 10 %.
lambda = 1.5e-5
