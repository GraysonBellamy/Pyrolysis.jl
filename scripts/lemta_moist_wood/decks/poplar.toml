# Poplar (Populus), grain across the heat flux.
#   Diarra et al. 2026, Table 1 (density); Flity et al. 2025, Fig. 12 and Table 1.
species = "poplar"
genus = "Populus"
rho_dry = 338.0
absorptivity = 0.872
emissivity_T_C = [30.0, 80.0, 130.0, 180.0, 230.0]
emissivity = [0.897, 0.893, 0.887, 0.880, 0.872]
h_front_heating = 7.1
h_front_cooling = 7.4
h_rear = 14.6
# Darcy permeability across the grain [m²]: Jinman 1991 Table 2, Populus
# davidiana heartwood, apparent at about 1 atm, T 2.0e-18, R 1.4e-18 (along the
# grain 5.4e-13).
permeability = 2.0e-18
# Sorption isotherm of the phase change: the CAST set of Dietenberger, Glass &
# Boardman (2024) fitted to beech, taken for this hardwood.
isotherm = "CAST_BEECH"
