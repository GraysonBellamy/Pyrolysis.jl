# MaCFP-2 PMMA property set Aalto-I (2021). Values: the group's FDS deck digits
# (PMMA/Validation_Results/Aalto-I/Aalto-I_MaCFP_25kW.fds); the JSON rounds E2 to 1.88e5 (-1.3 K at 10 K/min).
id = "Aalto_I"
year = 2021
json = "PMMA/Material_Properties/2021/MaCFP_PMMA_Aalto_I.json"
calibration_code = "FDS"
predictions = "Aalto"
validation = "Aalto-I/Aalto-I"            # MaCFP-3 prediction files (Validation_Results/<dir>/<prefix>)
tga_predictions = { 10 = "Aalto_TGA_10K.csv", 100 = "Aalto_TGA_100K.csv" }
absorption = "in-depth"
kappa_kernel = "two-flux"        # FDS: diffuse two-flux, attenuation 2*kappa
notes = [
  "kappa 3421.27321 1/m is the group's 25 kW/m2 deck; their 50 kW/m2 deck uses 3091.5. Which one produced the MaCFP-2 targets is not recorded.",
  "Their MaCFP-3 FDS 6.8.0 decks run with ADJUST_H on (the default; gas MMA, C5H8O2), which makes dH temperature-dependent; constant dH here.",
]

[gas]
cp = 0.0

[[components]]
id = "PMMA_a"
rho = 1150.0
y0 = 0.04
emissivity = 0.95
kappa = 3421.27321
k = { form = "constant", value = 0.154510076305046 }
cp = { form = "constant", value = 1755.9068263093 }

[[components]]
id = "PMMA_b"
rho = 1150.0
y0 = 0.96
emissivity = 0.95
kappa = 3421.27321
k = { form = "constant", value = 0.154510076305046 }
cp = { form = "constant", value = 1755.9068263093 }

[[reactions]]
reactant = "PMMA_a"
A = 6.392695e7
E = 9.37658359e4
n = 1.0
dH = 982604.48665021

[[reactions]]
reactant = "PMMA_b"
A = 2.42891855e13
E = 1.88411158e5
n = 1.0
dH = 982604.48665021
