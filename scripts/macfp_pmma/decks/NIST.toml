# MaCFP-2 PMMA property set NIST (2021). Source: PMMA/Material_Properties/2021/MaCFP_PMMA_NIST.json
id = "NIST"
year = 2021
json = "PMMA/Material_Properties/2021/MaCFP_PMMA_NIST.json"
calibration_code = "FDS"
predictions = "NIST"
validation = "NIST-FSRI/NIST-FSRI"            # MaCFP-3 prediction files (Validation_Results/<dir>/<prefix>)
tga_predictions = { 10 = "NIST_TGA_10K.csv", 100 = "NIST_TGA_100K.csv" }
absorption = "surface"           # JSON "inf"
notes = [
  "Absorption \"inf\" (a string) read as surface absorption.",
  "Validation_Results/NIST-FSRI holds CSVs only (no README, no deck); Calibration_Results/NIST_FSRI describes them as FDS 6.8 runs of this set, so ADJUST_H is on there; constant dH here.",
]

[gas]
cp = 0.0                         # FDS: no gas enthalpy in the solid

[[components]]
id = "PMMA"
rho = 1100.0
y0 = 1.0
emissivity = 0.9
k = { form = "constant", value = 0.20 }
cp = { form = "constant", value = 2200.0 }

[[reactions]]
reactant = "PMMA"
A = 2.85e13
E = 1.91e5
n = 1.0
dH = 8.7e5
