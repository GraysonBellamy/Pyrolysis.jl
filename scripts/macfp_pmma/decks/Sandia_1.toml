# MaCFP-2 PMMA kinetics-only set Sandia_1 (2021, Sandia, Sierra). TGA only; thermal properties are placeholders.
id = "Sandia_1"
year = 2021
json = "PMMA/Material_Properties/2021/MaCFP_PMMA_Sandia_1.json"
calibration_code = "Sierra"
kinetics_only = true
tga_predictions = { 10 = "Sandia_TGA_10K_Sandia1step.csv", 100 = "Sandia_TGA_100K_Sandia1step.csv" }
absorption = "surface"
order_basis = "density"
density_basis_rho = 1180.0
notes = [
  "A in density units (A rho^n, rho0 = 1180 kg/m3 assumed): only that reading reproduces their TGA (616 K peak).",
  "matl-db states neither Sierra's rate law nor Sandia's density; rho0 from 1100 to 1210 kg/m3 moves the 10 K/min peak over 618.6-621.1 K.",
  "matl-db's Verification deck multiplies A by 1180^2.56 (5.79e23) and runs it in density-form FDS, a double conversion.",
]

[gas]
cp = 0.0

[[components]]
id = "A"
rho = 1180.0
y0 = 1.0
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[components]]
id = "res"
rho = 1180.0
y0 = 0.0
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[reactions]]
reactant = "A"
A = 7920000000000000.0
E = 303434.0
n = 3.56
dH = 0.0
residue = "res"
residue_yield = 0.0001
