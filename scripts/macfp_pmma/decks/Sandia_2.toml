# MaCFP-2 PMMA kinetics-only set Sandia_2 (2021, Sandia, Sierra). TGA only; thermal properties are placeholders.
id = "Sandia_2"
year = 2021
json = "PMMA/Material_Properties/2021/MaCFP_PMMA_Sandia_2.json"
calibration_code = "Sierra"
kinetics_only = true
tga_predictions = { 10 = "Sandia_TGA_10K_UMET1step.csv", 100 = "Sandia_TGA_100K_UMET1step.csv" }
absorption = "surface"
order_basis = "own"
density_basis_rho = 1180.0
notes = [
  "One component, so \"own\" equals \"init\"; the normalised rate law reproduces their TGA (628.0 vs 629.0 K peak), the density form does not (545.5 K).",
  "matl-db's Verification deck leaves A unconverted for n = 2.07.",
]

[gas]
cp = 0.0

[[components]]
id = "A"
rho = 1180.0
y0 = 1.0
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[components]]
id = "res"
rho = 1180.0
y0 = 0.0
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[reactions]]
reactant = "A"
A = 1.24e+19
E = 252496.0
n = 2.07
dH = 0.0
residue = "res"
residue_yield = 0.0001
