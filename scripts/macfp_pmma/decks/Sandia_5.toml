# MaCFP-2 PMMA kinetics-only set Sandia_5 (2021, Sandia, Sierra). TGA only; thermal properties are placeholders.
id = "Sandia_5"
year = 2021
json = "PMMA/Material_Properties/2021/MaCFP_PMMA_Sandia_5.json"
calibration_code = "Sierra"
kinetics_only = true
tga_predictions = { 10 = "Sandia_TGA_10K_Sandia2stepparallel.csv", 100 = "Sandia_TGA_100K_Sandia2stepparallel.csv" }
absorption = "surface"
order_basis = "init"
density_basis_rho = 1180.0
notes = [
  "Normalised by the initial total mass (\"init\"): fits their 10 and 100 K/min TGA better than \"own\" in every comparison.",
  "matl-db's Verification deck leaves A unconverted for n = 3.14.",
]

[gas]
cp = 0.0

[[components]]
id = "A1"
rho = 1180.0
y0 = 0.09
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[components]]
id = "A2"
rho = 1180.0
y0 = 0.91
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[components]]
id = "res"
rho = 1180.0
y0 = 0.0
emissivity = 0.9
k = { form = "constant", value = 0.2 }
cp = { form = "constant", value = 1500.0 }

[[reactions]]
reactant = "A1"
A = 178000000000.0
E = 121466.0
n = 1.0
dH = 0.0
residue = "res"
residue_yield = 0.0004

[[reactions]]
