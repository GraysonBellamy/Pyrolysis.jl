# MaCFP-2 PMMA kinetics-only set Sandia_6 (2021, Sandia, Sierra). TGA only; thermal properties are placeholders.
id = "Sandia_6"
year = 2021
json = "PMMA/Material_Properties/2021/MaCFP_PMMA_Sandia_6.json"
calibration_code = "Sierra"
kinetics_only = true
tga_predictions = { 10 = "Sandia_TGA_10K_UMET2stepparallel.csv", 100 = "Sandia_TGA_100K_UMET2stepparallel.csv" }
absorption = "surface"
order_basis = "init"
density_basis_rho = 1180.0
notes = [
  "Normalised by the initial total mass (\"init\"): fits their 10 and 100 K/min TGA better than \"own\" in every comparison.",
  "matl-db's Verification deck leaves A unconverted for n = 1.92.",
]

[gas]
cp = 0.0

